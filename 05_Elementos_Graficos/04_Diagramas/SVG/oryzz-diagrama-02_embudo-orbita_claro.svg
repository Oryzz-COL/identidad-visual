<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Oryzz · diagrama · embudo de captación como órbita"><title>Oryzz · diagrama · embudo de captación como órbita</title><desc>Cinco etapas en ciclo alrededor del cliente: captar, responder, clasificar, seguir y medir.</desc><rect width="1920" height="1080" fill="#FFFFFF"/><defs><radialGradient id="rtg" cx="1190.4" cy="561.6" r="1152.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="0.55" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="rtm" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="url(#rtg)"/></mask></defs><g mask="url(#rtm)"><path d="M0.0 0V1080M64.0 0V1080M128.0 0V1080M192.0 0V1080M256.0 0V1080M320.0 0V1080M384.0 0V1080M448.0 0V1080M512.0 0V1080M576.0 0V1080M640.0 0V1080M704.0 0V1080M768.0 0V1080M832.0 0V1080M896.0 0V1080M960.0 0V1080M1024.0 0V1080M1088.0 0V1080M1152.0 0V1080M1216.0 0V1080M1280.0 0V1080M1344.0 0V1080M1408.0 0V1080M1472.0 0V1080M1536.0 0V1080M1600.0 0V1080M1664.0 0V1080M1728.0 0V1080M1792.0 0V1080M1856.0 0V1080M1920.0 0V1080M0 0.0H1920M0 64.0H1920M0 128.0H1920M0 192.0H1920M0 256.0H1920M0 320.0H1920M0 384.0H1920M0 448.0H1920M0 512.0H1920M0 576.0H1920M0 640.0H1920M0 704.0H1920M0 768.0H1920M0 832.0H1920M0 896.0H1920M0 960.0H1920M0 1024.0H1920" stroke="#0B0D12" stroke-opacity="0.05" stroke-width="1" fill="none"/></g><text x="120.00" y="134.00" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="20" letter-spacing="2.40" fill="#5A6172">MÉTODO ORYZZ · 02 · EMBUDO DE CAPTACIÓN</text><text x="120.00" y="216.80" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="700" font-size="64" letter-spacing="-2.24" fill="#0B0D12">El embudo</text><text x="120.00" y="284.00" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="700" font-size="64" letter-spacing="-2.24" fill="#0B0D12">es una órbita.</text><text x="120.00" y="375.20" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="24" fill="#5A6172">No acaba en el clic. Cada contacto se responde, se</text><text x="120.00" y="411.20" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="24" fill="#5A6172">clasifica y se sigue hasta que es cliente. Lo que se</text><text x="120.00" y="447.20" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="24" fill="#5A6172">mide vuelve a alimentar la captación.</text><path d="M1282.00 288.89A272 272 0 0 1 1511.04 455.30" fill="none" stroke="#3A4152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1410.9 340.6L1419.9 339.9L1417.7 331.2" fill="none" stroke="#3A4152" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M1524.64 497.15A272 272 0 0 1 1437.15 766.40" fill="none" stroke="#3A4152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1515.3 635.7L1518.7 644.1L1526.3 639.3" fill="none" stroke="#3A4152" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M1401.56 792.26A272 272 0 0 1 1118.44 792.26" fill="none" stroke="#3A4152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1266.9 826.2L1260.0 832.0L1266.9 837.8" fill="none" stroke="#3A4152" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M1082.85 766.40A272 272 0 0 1 995.36 497.15" fill="none" stroke="#3A4152" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1008.9 648.8L1001.3 644.1L997.9 652.4" fill="none" stroke="#3A4152" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M1008.96 455.30A272 272 0 0 1 1238.00 288.89" fill="none" stroke="#C7CBD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1097.9 348.7L1100.1 339.9L1091.1 339.3" fill="none" stroke="#C7CBD6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M1360.00 386.79A200 200 0 1 1 1191.60 372.06" fill="none" stroke="#D5D9E0" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><circle cx="1260.0" cy="288.0" r="9" fill="#FFFFFF" stroke="#0B0D12" stroke-width="2"/><text x="1260.00" y="148.00" dx="1.08" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="18" letter-spacing="2.16" text-anchor="middle" fill="#5A6172">01</text><text x="1260.00" y="186.00" dx="-0.32" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="600" font-size="32" letter-spacing="-0.64" text-anchor="middle" fill="#0B0D12">Captar</text><text x="1260.00" y="220.00" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" text-anchor="middle" fill="#5A6172">Meta, Google, TikTok y</text><text x="1260.00" y="251.00" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" text-anchor="middle" fill="#5A6172">búsqueda con IA.</text><circle cx="1518.7" cy="475.9" r="9" fill="#FFFFFF" stroke="#0B0D12" stroke-width="2"/><text x="1560.53" y="434.35" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="18" letter-spacing="2.16" fill="#5A6172">02</text><text x="1560.53" y="472.35" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="600" font-size="32" letter-spacing="-0.64" fill="#0B0D12">Responder</text><text x="1560.53" y="506.35" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" fill="#5A6172">WhatsApp o email en</text><text x="1560.53" y="537.35" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" fill="#5A6172">minutos, también de noche.</text><circle cx="1419.9" cy="780.1" r="9" fill="#FFFFFF" stroke="#0B0D12" stroke-width="2"/><text x="1445.74" y="831.65" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="18" letter-spacing="2.16" fill="#5A6172">03</text><text x="1445.74" y="869.65" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="600" font-size="32" letter-spacing="-0.64" fill="#0B0D12">Clasificar</text><text x="1445.74" y="903.65" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" fill="#5A6172">La IA separa curiosos de</text><text x="1445.74" y="934.65" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" fill="#5A6172">clientes con intención.</text><circle cx="1100.1" cy="780.1" r="9" fill="#FFFFFF" stroke="#0B0D12" stroke-width="2"/><text x="1074.26" y="831.65" dx="2.16" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="18" letter-spacing="2.16" text-anchor="end" fill="#5A6172">04</text><text x="1074.26" y="869.65" dx="-0.64" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="600" font-size="32" letter-spacing="-0.64" text-anchor="end" fill="#0B0D12">Seguir</text><text x="1074.26" y="903.65" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" text-anchor="end" fill="#5A6172">Recordatorios y seguimiento</text><text x="1074.26" y="934.65" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" text-anchor="end" fill="#5A6172">hasta la cita.</text><circle cx="1001.3" cy="475.9" r="9" fill="#FFFFFF" stroke="#0B0D12" stroke-width="2"/><text x="959.47" y="434.35" dx="2.16" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="18" letter-spacing="2.16" text-anchor="end" fill="#5A6172">05</text><text x="959.47" y="472.35" dx="-0.64" font-family="'Space Grotesk', Arial, Helvetica, sans-serif" font-weight="600" font-size="32" letter-spacing="-0.64" text-anchor="end" fill="#0B0D12">Medir</text><text x="959.47" y="506.35" font-family="Manrope, Arial, Helvetica, sans-serif" font-weight="400" font-size="22" text-anchor="end" fill="#5A6172">Coste por lead, citas y euros.</text><circle cx="1260.0" cy="560.0" r="36.4" fill="none" stroke="#7FB02E" stroke-width="1.5" opacity=".45"/><circle cx="1260.0" cy="560.0" r="14" fill="#7FB02E"/><text x="1260.00" y="632.00" dx="1.20" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="20" letter-spacing="2.40" text-anchor="middle" fill="#0B0D12">CLIENTE</text><path d="M120 984H1800" stroke="#D5D9E0" stroke-width="1"/><text x="120.00" y="1024.00" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-weight="500" font-size="18" letter-spacing="2.16" fill="#5A6172">CAPTAR → RESPONDER → CLASIFICAR → SEGUIR → MEDIR</text><svg x="1668.00" y="1004.00" width="132.00" height="32.69" viewBox="0 4.0 3456.6 856.1" aria-label="oryzz"><g transform="translate(-109.81 -105.81) scale(10.4582)"><path d="M35.58 19.21A34 34 0 1 0 76.59 28.81" fill="none" stroke="#3B72FF" stroke-width="11.0" stroke-linecap="round"/><circle cx="64.42" cy="19.21" r="7.5" fill="#7FB02E"/></g><path d="M1280.6 674.0999999999999Q1206.6 674.0999999999999 1147.6 644.0999999999999Q1088.6 614.0999999999999 1054.6 557.0999999999999Q1020.5999999999999 500.0999999999999 1020.5999999999999 420.0999999999999V404.0999999999999Q1020.5999999999999 324.0999999999999 1054.6 267.0999999999999Q1088.6 210.0999999999999 1147.6 180.0999999999999Q1206.6 150.0999999999999 1280.6 150.0999999999999Q1354.6 150.0999999999999 1413.6 180.0999999999999Q1472.6 210.0999999999999 1506.6 267.0999999999999Q1540.6 324.0999999999999 1540.6 404.0999999999999V420.0999999999999Q1540.6 500.0999999999999 1506.6 557.0999999999999Q1472.6 614.0999999999999 1413.6 644.0999999999999Q1354.6 674.0999999999999 1280.6 674.0999999999999ZM1280.6 562.0999999999999Q1338.6 562.0999999999999 1376.6 524.5999999999999Q1414.6 487.0999999999999 1414.6 417.0999999999999V407.099999
<script>
/* Ajuste automático: si un texto con data-fit no cabe, se reduce su cuerpo hasta el
   mínimo indicado (data-fit="px"). Si aun así no cabe, la pieza se marca en rojo. */
(function () {
  function desborda(box) { return box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1; }
  function ajustar() {
    var boxes = Array.prototype.slice.call(document.querySelectorAll('[data-fit-box]'));
    boxes.forEach(function (box) {
      var els = Array.prototype.slice.call(box.querySelectorAll('[data-fit]'));
      var guard = 0;
      while (desborda(box) && guard++ < 200) {
        var cambiado = false;
        els.forEach(function (el) {
          var fs = parseFloat(getComputedStyle(el).fontSize), min = parseFloat(el.dataset.fit) || fs * .7;
          if (fs > min) { el.style.fontSize = Math.max(min, fs - 2) + 'px'; cambiado = true; }
        });
        if (!cambiado) break;
      }
      if (desborda(box)) document.body.classList.add('desborde');
    });
    document.body.setAttribute('data-listo', '1');
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar); else window.onload = ajustar;
})();
</script>
